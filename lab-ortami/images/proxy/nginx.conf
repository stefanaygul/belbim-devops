user nginx;
worker_processes 2;
error_log /var/log/nginx/error.log notice;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
}

# GitLab SSH: TCP gecisi (gitlab.<D>:22 -> gitlab container'i)
stream {
    resolver 127.0.0.11 valid=10s ipv6=off;

    server {
        listen 22;
        set $gitlab_ssh gitlab:22;
        proxy_pass $gitlab_ssh;
        proxy_connect_timeout 5s;
    }
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format lab '$remote_addr $host:$server_port "$request" $status $body_bytes_sent ${request_time}s';
    access_log /var/log/nginx/access.log lab;

    sendfile on;
    server_tokens off;

    # Upstream adlari istek aninda cozulur: ci profili kapaliyken proxy yine acilir,
    # yeniden baslatilan servisin yeni IP'si kendiliginden alinir.
    resolver 127.0.0.11 valid=10s ipv6=off;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    include /etc/nginx/conf.d/*.conf;
}
